<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文档寻迹 · 全库内容检索</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <style>
    :root {
      --ink: #1e2b32;
      --muted: #718087;
      --line: #dfe7e6;
      --soft: #f3f7f6;
      --canvas: #f8fbfa;
      --teal: #167d75;
      --teal-2: #d9efec;
      --orange: #d97735;
      --yellow: #f3c96a;
      --shadow: 0 20px 50px rgba(35, 63, 64, .10);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; background: #fff; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--teal); color: #fff; box-shadow: 0 8px 18px rgba(22,125,117,.24); }
    .brand-mark svg { width: 19px; height: 19px; }
    .brand-name { font-size: 17px; font-weight: 760; letter-spacing: .2px; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-button { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #5c6d72; }
    .icon-button:hover { background: var(--soft); color: var(--teal); }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #f5dfbc; color: #8b5d29; font-size: 12px; font-weight: 800; }
    .workspace { flex: 1; display: grid; grid-template-columns: 246px minmax(0, 1fr) 344px; min-height: 0; }
    .sidebar { background: #fff; border-right: 1px solid var(--line); padding: 24px 16px; }
    .side-label { padding: 0 12px; color: #99a5a7; font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: 1px; }
    .nav-list { display: grid; gap: 4px; margin: 10px 0 26px; }
    .nav-item { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 7px; background: transparent; color: #526269; font-size: 13px; text-align: left; }
    .nav-item svg { width: 16px; height: 16px; color: #87979a; }
    .nav-item:hover, .nav-item.active { background: var(--teal-2); color: var(--teal); font-weight: 700; }
    .nav-item.active svg { color: var(--teal); }
    .count { margin-left: auto; font-size: 11px; color: #98a5a7; }
    .nav-item.active .count { color: var(--teal); }
    .side-section { border-top: 1px solid var(--line); padding-top: 20px; }
    .folder-row { display:flex; align-items:center; justify-content:space-between; padding: 0 12px 8px; }
    .folder-name { color:#617076; font-size: 12px; font-weight: 700; }
    .folder-list { display:grid; gap: 4px; }
    .folder { display:flex; align-items:center; gap:9px; padding: 8px 12px; color:#647278; font-size:12px; border-radius:7px; }
    .folder:hover { background: var(--soft); color:var(--teal); }
    .folder svg { width: 15px; height:15px; color:#9aaba8; }
    .main { min-width: 0; padding: 30px 32px 44px; overflow: auto; }
    .main-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom: 23px; }
    h1 { margin:0; font-size: 26px; letter-spacing:-.4px; }
    .heading-copy { margin: 7px 0 0; color:var(--muted); font-size:13px; }
    .upload-button { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 15px; border-radius:7px; background:var(--teal); color:#fff; font-size:13px; font-weight:700; box-shadow: 0 8px 18px rgba(22,125,117,.2); }
    .upload-button:hover { background:#116c65; }
    .upload-button svg { width:16px; height:16px; }
    .searchbar { display:flex; align-items:center; gap:12px; min-height:52px; padding:0 14px; background:#fff; border:1px solid #cfdcda; border-radius:9px; box-shadow:0 5px 14px rgba(32,66,67,.05); }
    .searchbar:focus-within { border-color:var(--teal); box-shadow:0 0 0 3px rgba(22,125,117,.12); }
    .searchbar > svg { width:19px; color:#819397; flex:0 0 auto; }
    .searchbar input { flex:1; min-width:0; border:0; outline:0; color:var(--ink); font-size:14px; background:transparent; }
    .searchbar input::placeholder { color:#a2afb0; }
    .scope-select { border:0; outline:0; color:#647478; background:transparent; font-size:12px; padding-left:12px; border-left:1px solid var(--line); cursor:pointer; }
    .clear-search { display:none; width:26px; height:26px; place-items:center; background:transparent; color:#9aabad; }
    .clear-search.show { display:grid; }
    .clear-search svg { width:15px; }
    .dropzone { display:flex; align-items:center; gap:13px; min-height: 72px; margin-top:14px; padding: 14px 17px; border: 1px dashed #b7cbc8; border-radius:8px; background: #f6fbfa; color:#5d7475; cursor:pointer; }
    .dropzone:hover, .dropzone.dragging { border-color:var(--teal); background:var(--teal-2); }
    .drop-icon { width:36px; height:36px; display:grid; place-items:center; border-radius:8px; background:#dcefeb; color:var(--teal); }
    .drop-icon svg { width:18px; }
    .drop-title { color:#365353; font-size:13px; font-weight:730; }
    .drop-meta { color:#839594; font-size:11px; margin-top:3px; }
    .stats { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin:22px 0 28px; }
    .stat { min-height:78px; padding:14px 16px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .stat-label { color:#879596; font-size:11px; }
    .stat-value { margin-top:7px; font-size:21px; font-weight:760; letter-spacing:-.3px; }
    .stat-note { color:#77908f; font-size:10px; margin-top:4px; }
    .results-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
    .results-title { font-size:15px; font-weight:760; }
    .results-count { color:#98a5a5; font-size:12px; margin-left:7px; font-weight:500; }
    .sort-select { color:#718080; border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 9px; font-size:11px; outline:0; }
    .results-list { display:grid; gap:9px; }
    .result { position:relative; display:grid; grid-template-columns: 37px minmax(0,1fr) 30px; gap:12px; padding:14px 14px; background:#fff; border:1px solid var(--line); border-radius:8px; cursor:pointer; transition: border .15s, box-shadow .15s, transform .15s; }
    .result:hover, .result.selected { border-color:#9fc7c3; box-shadow:var(--shadow); transform: translateY(-1px); }
    .result.selected { border-left:3px solid var(--teal); padding-left:12px; }
    .file-icon { width:36px; height:36px; display:grid; place-items:center; border-radius:7px; background:#e8f4f1; color:var(--teal); font-size:10px; font-weight:800; }
    .file-icon.pdf { background:#fff0e9; color:#d5653a; }
    .file-icon.doc { background:#eaf0fb; color:#466eb1; }
    .file-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#2e4248; font-size:13px; font-weight:730; }
    .file-path { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:3px; color:#98a5a7; font-size:10px; }
    .snippet { margin-top:9px; color:#52666b; font-size:12px; line-height:1.6; }
    mark { padding:1px 3px; border-radius:3px; background:#fff1bf; color:#614b11; }
    .result-meta { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:9px; color:#99a5a7; font-size:10px; }
    .result-meta span + span { padding-left:8px; border-left:1px solid #e2e9e7; }
    .star { width:28px; height:28px; display:grid; place-items:center; background:transparent; color:#adbbba; border-radius:5px; }
    .star:hover { background:#fff7dc; color:#d59a21; }
    .star.fav { color:#d59a21; }
    .star svg { width:16px; }
    .empty { display:none; padding:50px 20px; text-align:center; border:1px dashed #cbdad7; border-radius:8px; background:#fff; color:#879596; }
    .empty.show { display:block; }
    .empty svg { width:30px; height:30px; color:#a8bfbc; margin-bottom:10px; }
    .empty strong { display:block; color:#53686a; font-size:14px; }
    .empty p { margin:6px 0 0; font-size:12px; }
    .detail { min-width:0; background:#fff; border-left:1px solid var(--line); padding:28px 23px; overflow:auto; }
    .detail-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:22px; }
    .detail-kicker { color:#99a6a7; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
    .detail-actions { display:flex; gap:6px; }
    .detail-actions .icon-button { width:30px; height:30px; }
    .detail-file { display:flex; gap:12px; align-items:center; padding-bottom:20px; border-bottom:1px solid var(--line); }
    .detail-file .file-icon { width:42px; height:42px; }
    .detail-file h2 { overflow-wrap:anywhere; margin:0; font-size:15px; line-height:1.35; }
    .detail-file p { margin:5px 0 0; color:#94a1a1; font-size:11px; }
    .detail-info { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:18px 0; border-bottom:1px solid var(--line); }
    .info-label { color:#99a5a6; font-size:10px; }
    .info-value { margin-top:4px; color:#4c6264; font-size:12px; font-weight:650; }
    .preview-head { display:flex; align-items:center; justify-content:space-between; margin:20px 0 9px; }
    .preview-head strong { font-size:12px; }
    .preview-head span { color:#9aa7a8; font-size:10px; }
    .preview { padding:16px; border:1px solid var(--line); border-radius:7px; background:#fbfdfc; color:#5d6e70; font-size:12px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; max-height:430px; overflow:auto; }
    .preview mark { background:#ffe8a1; }
    .detail-empty { display:grid; place-items:center; min-height:450px; text-align:center; color:#91a0a0; }
    .detail-empty svg { width:35px; height:35px; color:#bad0cc; margin-bottom:12px; }
    .detail-empty strong { display:block; color:#617476; font-size:13px; }
    .detail-empty p { font-size:11px; margin:6px 0 0; }
    .toast { position:fixed; left:50%; bottom:24px; z-index:4; transform:translate(-50%, 20px); opacity:0; pointer-events:none; padding:11px 16px; color:#fff; background:#273b3d; border-radius:7px; font-size:12px; box-shadow:0 12px 30px rgba(20,45,47,.22); transition:opacity .2s, transform .2s; }
    .toast.show { opacity:1; transform:translate(-50%, 0); }
    @media (max-width: 1120px) { .workspace { grid-template-columns: 210px minmax(0,1fr); } .detail { display:none; } }
    @media (max-width: 720px) { .topbar { height:64px; padding:0 16px; } .brand-sub { display:none; } .workspace { display:block; } .sidebar { display:none; } .main { padding:22px 16px 32px; } .main-heading { align-items:flex-start; flex-direction:column; gap:15px; } .upload-button { width:100%; justify-content:center; } .stats { gap:8px; } .stat { padding:12px; } .stat-value { font-size:18px; } .scope-select { display:none; } .searchbar { min-height:48px; } .dropzone { min-height:68px; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="scan-search"></i></div>
        <div><div class="brand-name">文档寻迹</div><div class="brand-sub">全库内容检索</div></div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="helpBtn" title="查看帮助"><i data-lucide="circle-help"></i></button>
        <button class="icon-button" id="settingsBtn" title="设置"><i data-lucide="sliders-horizontal"></i></button>
        <div class="avatar" title="当前用户">林</div>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="side-label">资料库</div>
        <nav class="nav-list">
          <button class="nav-item active" data-view="all"><i data-lucide="files"></i><span>全部文档</span><span class="count" id="allCount">0</span></button>
          <button class="nav-item" data-view="recent"><i data-lucide="clock-3"></i><span>最近添加</span><span class="count" id="recentCount">0</span></button>
          <button class="nav-item" data-view="favorites"><i data-lucide="star"></i><span>已收藏</span><span class="count" id="favCount">0</span></button>
        </nav>
        <div class="side-section">
          <div class="folder-row"><span class="folder-name">文件夹</span><button class="icon-button" style="width:25px;height:25px" id="newFolderBtn" title="新建文件夹"><i data-lucide="plus"></i></button></div>
          <div class="folder-list"><button class="folder"><i data-lucide="folder"></i><span>项目资料</span></button><button class="folder"><i data-lucide="folder"></i><span>研究笔记</span></button><button class="folder"><i data-lucide="folder"></i><span>会议纪要</span></button></div>
        </div>
      </aside>
      <main class="main">
        <div class="main-heading"><div><h1>全库内容检索</h1><p class="heading-copy">搜索你已导入的文件，快速找到需要的那一段内容。</p></div><button class="upload-button" id="uploadBtn"><i data-lucide="upload"></i><span>导入文件</span></button></div>
        <div class="searchbar"><i data-lucide="search"></i><input id="searchInput" type="search" placeholder="输入多个关键词，或用引号搜索完整短语…" autocomplete="off" /><select class="scope-select" id="scopeSelect"><option value="all">所有文件</option><option value="pdf">仅 PDF</option><option value="doc">仅 Word</option><option value="txt">仅 TXT</option></select><button class="clear-search" id="clearSearch" title="清除搜索"><i data-lucide="x"></i></button></div>
        <div class="dropzone" id="dropzone"><div class="drop-icon"><i data-lucide="file-up"></i></div><div><div class="drop-title">拖放文件到这里，或点击导入</div><div class="drop-meta">支持 PDF、DOCX、TXT · 文件只保存在当前浏览器</div></div></div>
        <input id="fileInput" type="file" accept=".pdf,.doc,.docx,.txt,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden />
        <div class="stats"><div class="stat"><div class="stat-label">已索引文档</div><div class="stat-value" id="statDocs">0</div><div class="stat-note">全部内容均可全文搜索</div></div><div class="stat"><div class="stat-label">已提取字符</div><div class="stat-value" id="statChars">0</div><div class="stat-note">含标题与正文</div></div><div class="stat"><div class="stat-label">最近同步</div><div class="stat-value" id="statSync">刚刚</div><div class="stat-note">本地索引状态正常</div></div></div>
        <div class="results-head"><div><span class="results-title">搜索结果</span><span class="results-count" id="resultsCount">0 个结果</span></div><select class="sort-select" id="sortSelect"><option value="relevance">按相关度排序</option><option value="recent">按最近添加</option><option value="name">按文件名</option></select></div>
        <div class="results-list" id="resultsList"></div>
        <div class="empty" id="emptyState"><i data-lucide="search-x"></i><strong>没有找到匹配内容</strong><p>换个关键词试试，或导入更多文件。</p></div>
      </main>
      <aside class="detail" id="detailPanel"><div class="detail-empty" id="detailEmpty"><div><i data-lucide="panel-right"></i><strong>选择一条结果查看详情</strong><p>正文预览会在这里显示</p></div></div><div id="detailContent" hidden></div></aside>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const seedDocs = [
      { id:'seed-brief', name:'Q3 产品路线图.pdf', ext:'pdf', path:'项目资料 / 产品规划', size:'2.4 MB', date:'2026-08-22', content:'第三季度产品路线图\n\n本季度围绕搜索体验、知识沉淀与协作效率推进。7 月完成统一检索入口，8 月上线文档预览与关键词高亮，9 月将接入团队权限与版本追踪。\n\n关键目标：搜索首屏响应小于 500ms；常用文件覆盖率达到 90%；新用户首次搜索成功率提升至 80%。' },
      { id:'seed-research', name:'用户访谈整理.txt', ext:'txt', path:'研究笔记 / 访谈', size:'18 KB', date:'2026-08-20', content:'用户访谈整理｜第 06 轮\n\n受访者普遍认为，文件多并不可怕，真正困难的是记得内容藏在哪个文件里。大家希望搜索可以理解自然语言，也希望结果能够直接落到原文段落。\n\n高频诉求：支持 PDF 和 Word；显示命中上下文；保留最近搜索；可以收藏重要文件。' },
      { id:'seed-meeting', name:'周会纪要 08-18.docx', ext:'doc', path:'会议纪要 / 2026 年 8 月', size:'126 KB', date:'2026-08-18', content:'周会纪要｜2026.08.18\n\n一、本周进展\n1. 完成文档解析服务的错误重试。\n2. 搜索结果支持按相关度和时间排序。\n3. 设计评审通过新的预览侧栏。\n\n二、待办事项\n产品：补充空状态与导入失败提示；工程：完善大文件分片读取；设计：整理文件类型图标规范。' },
      { id:'seed-guide', name:'品牌语气指南.pdf', ext:'pdf', path:'项目资料 / 设计规范', size:'840 KB', date:'2026-08-10', content:'品牌语气指南\n\n我们说话要清晰、具体、有分寸。少用口号，多给用户下一步可执行的动作。界面文案尽量使用短句，错误提示需要说明发生了什么，以及用户可以如何处理。\n\n关键词：可靠、克制、友好、专业。' }
    ];
    const storeKey = 'document-trace-index-v1';
    let docs = loadDocs();
    let activeView = 'all';
    let query = '';
    let selectedId = null;
    let toastTimer;
    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function loadDocs(){ try { const saved = JSON.parse(localStorage.getItem(storeKey)); return Array.isArray(saved) && saved.length ? saved : seedDocs.map(d=>({...d, favorite:false})); } catch { return seedDocs.map(d=>({...d, favorite:false})); } }
    function saveDocs(){ localStorage.setItem(storeKey, JSON.stringify(docs)); }
    function typeLabel(ext){ return ext === 'pdf' ? 'PDF' : ext === 'doc' ? 'DOCX' : 'TXT'; }
    function formatDate(value){ const d = new Date(value); return isNaN(d) ? value : `${d.getMonth()+1}月${d.getDate()}日`; }
    function formatChars(n){ return n > 9999 ? `${(n/10000).toFixed(1)} 万` : n.toLocaleString('zh-CN'); }
    function escapeRegex(value){ return String(value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function normalizeText(value){ return String(value || '').toLocaleLowerCase('zh-CN'); }
    function parseQuery(raw){
      const phrases=[];
      const remainder=String(raw || '').replace(/["“]([^"”]+)["”]/g,(_, phrase)=>{ const clean=phrase.trim(); if(clean) phrases.push(clean); return ' '; });
      const loose=remainder.split(/[\s,，、;；|]+/).map(x=>x.trim()).filter(Boolean);
      const terms=[...phrases,...loose].filter((term,index,array)=>array.findIndex(x=>normalizeText(x)===normalizeText(term))===index);
      return { terms, phrases };
    }
    function countOccurrences(text, term){ const source=normalizeText(text), needle=normalizeText(term); if(!needle) return 0; let count=0, from=0, at=-1; while((at=source.indexOf(needle,from))!==-1){ count++; from=at+Math.max(needle.length,1); } return count; }
    function getSearchMeta(doc){
      const parsed=parseQuery(query);
      if(!parsed.terms.length) return { matches:0, score:0, matchedTerms:0, totalTerms:0, firstTerm:'' };
      const name=doc.name, body=doc.content; let matches=0, score=0, matchedTerms=0, firstTerm='';
      parsed.terms.forEach(term=>{ const nameHits=countOccurrences(name,term), bodyHits=countOccurrences(body,term); const hits=nameHits+bodyHits; if(hits){ matchedTerms++; if(!firstTerm) firstTerm=term; } matches+=hits; score += nameHits*12 + bodyHits*2; });
      parsed.phrases.forEach(phrase=>{ const phraseHits=countOccurrences(body,phrase)+countOccurrences(name,phrase); score += phraseHits*8; });
      const coverage=matchedTerms/parsed.terms.length;
      return { matches, score: coverage===1 ? score + coverage*10 : -1, matchedTerms, totalTerms:parsed.terms.length, firstTerm };
    }
    function highlight(text, rawQuery){
      const terms=parseQuery(rawQuery).terms.map(escapeHTML).filter(Boolean).sort((a,b)=>b.length-a.length);
      const safe=escapeHTML(text); if(!terms.length) return safe;
      return safe.replace(new RegExp(`(${terms.join('|')})`, 'gi'), '<mark>$1</mark>');
    }
    function snippet(doc, meta){
      const source=doc.content.replace(/\s+/g,' '); if(!query || !meta.firstTerm) return source.slice(0,150);
      const lower=normalizeText(source), pos=lower.indexOf(normalizeText(meta.firstTerm)); if(pos<0) return source.slice(0,150);
      const start=Math.max(0,pos-62), end=pos+meta.firstTerm.length+98;
      return `${start>0?'…':''}${source.slice(start,end)}${end<source.length?'…':''}`;
    }
    function filteredDocs(){
      let list=docs.filter(d => activeView==='favorites' ? d.favorite : true);
      if(activeView==='recent') list=list.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
      const scope=$('scopeSelect').value; if(scope!=='all') list=list.filter(d=>d.ext===scope);
      const ranked=list.map(doc=>({doc,meta:getSearchMeta(doc)})).filter(row=>!query || row.meta.score>=0);
      const sort=$('sortSelect').value;
      if(sort==='recent') ranked.sort((a,b)=>new Date(b.doc.date)-new Date(a.doc.date));
      else if(sort==='name') ranked.sort((a,b)=>a.doc.name.localeCompare(b.doc.name,'zh-CN'));
      else ranked.sort((a,b)=>b.meta.score-a.meta.score || new Date(b.doc.date)-new Date(a.doc.date));
      return ranked;
    }
    function render(){
      const list=filteredDocs(); $('resultsCount').textContent=`${list.length} 个结果`; $('allCount').textContent=docs.length; $('recentCount').textContent=Math.min(5,docs.length); $('favCount').textContent=docs.filter(d=>d.favorite).length; $('statDocs').textContent=docs.length; $('statChars').textContent=formatChars(docs.reduce((s,d)=>s+d.content.length,0)); $('clearSearch').classList.toggle('show',!!query);
      $('resultsList').innerHTML=list.map(({doc,meta})=>`<article class="result ${selectedId===doc.id?'selected':''}" data-id="${doc.id}"><div class="file-icon ${doc.ext}">${typeLabel(doc.ext)}</div><div><div class="file-name">${highlight(doc.name,query)}</div><div class="file-path">${escapeHTML(doc.path)}</div><div class="snippet">${highlight(snippet(doc,meta),query)}</div><div class="result-meta"><span>${formatDate(doc.date)}</span><span>${escapeHTML(doc.size||'已导入')}</span><span>${meta.matches||'—'} 次命中</span>${query&&meta.totalTerms>1?`<span>覆盖 ${meta.matchedTerms}/${meta.totalTerms} 词</span>`:''}</div></div><button class="star ${doc.favorite?'fav':''}" data-fav="${doc.id}" title="${doc.favorite?'取消收藏':'收藏'}"><i data-lucide="star"></i></button></article>`).join(''); $('emptyState').classList.toggle('show', list.length===0); document.querySelectorAll('.result').forEach(el=>el.addEventListener('click', e=>{if(e.target.closest('[data-fav]')) return; selectedId=el.dataset.id; render(); renderDetail();})); document.querySelectorAll('[data-fav]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation(); const d=docs.find(x=>x.id===btn.dataset.fav); d.favorite=!d.favorite; saveDocs(); render(); if(selectedId===d.id) renderDetail(); showToast(d.favorite?'已加入收藏':'已取消收藏'); })); if(window.lucide) lucide.createIcons();
      if(selectedId && !list.some(d=>d.id===selectedId)){ selectedId=null; renderDetail(); }
    }
    function renderDetail(){ const doc=docs.find(d=>d.id===selectedId); if(!doc){ $('detailEmpty').hidden=false; $('detailContent').hidden=true; return; } $('detailEmpty').hidden=true; $('detailContent').hidden=false; $('detailContent').innerHTML=`<div class="detail-top"><span class="detail-kicker">文档详情</span><div class="detail-actions"><button class="icon-button" id="copyBtn" title="复制正文"><i data-lucide="copy"></i></button><button class="icon-button" id="detailFavBtn" title="${doc.favorite?'取消收藏':'收藏'}"><i data-lucide="star"></i></button></div></div><div class="detail-file"><div class="file-icon ${doc.ext}">${typeLabel(doc.ext)}</div><div><h2>${escapeHTML(doc.name)}</h2><p>${escapeHTML(doc.path)}</p></div></div><div class="detail-info"><div><div class="info-label">文件大小</div><div class="info-value">${escapeHTML(doc.size||'已导入')}</div></div><div><div class="info-label">导入日期</div><div class="info-value">${formatDate(doc.date)}</div></div><div><div class="info-label">字符数</div><div class="info-value">${doc.content.length.toLocaleString('zh-CN')}</div></div><div><div class="info-label">文件类型</div><div class="info-value">${typeLabel(doc.ext)}</div></div></div><div class="preview-head"><strong>正文预览</strong><span>${query?`${getSearchMeta(doc).matches} 处命中`: '全文'}</span></div><div class="preview">${highlight(doc.content,query)}</div>`; if(window.lucide) lucide.createIcons(); $('copyBtn').addEventListener('click',()=>{ if(!navigator.clipboard){ showToast('当前浏览器不支持复制'); return; } navigator.clipboard.writeText(doc.content).then(()=>showToast('正文已复制')).catch(()=>showToast('当前浏览器不支持复制')); }); $('detailFavBtn').addEventListener('click',()=>{doc.favorite=!doc.favorite; saveDocs(); render(); renderDetail();}); }
    function showToast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }
    async function parseFile(file){ const name=file.name; const ext=name.toLowerCase().endsWith('.pdf')?'pdf':name.toLowerCase().endsWith('.docx')||name.toLowerCase().endsWith('.doc')?'doc':'txt'; if(ext==='txt') return {content:await file.text(),ext}; if(ext==='doc'){ if(!window.mammoth) throw new Error('Word 解析组件尚未加载'); const array=await file.arrayBuffer(); const result=await mammoth.extractRawText({arrayBuffer:array}); return {content:result.value,ext:'doc'}; } if(ext==='pdf'){ if(!window.pdfjsLib) throw new Error('PDF 解析组件尚未加载'); const data=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data}).promise; let content=''; for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const text=await page.getTextContent(); content += `第 ${i} 页\n` + text.items.map(item=>item.str).join(' ') + '\n\n'; } return {content,ext}; } throw new Error('不支持的文件类型'); }
    async function importFiles(files){ const arr=Array.from(files); if(!arr.length) return; showToast(`正在解析 ${arr.length} 个文件…`); for(const file of arr){ try { const parsed=await parseFile(file); if(!parsed.content.trim()) throw new Error('未提取到可搜索文本'); docs.unshift({id:`user-${Date.now()}-${Math.random().toString(16).slice(2)}`,name:file.name,ext:parsed.ext,path:'本地导入',size:file.size>1024*1024?`${(file.size/1024/1024).toFixed(1)} MB`:`${Math.max(1,Math.round(file.size/1024))} KB`,date:new Date().toISOString(),content:parsed.content,favorite:false}); } catch(err){ showToast(`${file.name}：${err.message}`); } } saveDocs(); selectedId=docs[0]?.id||null; render(); renderDetail(); if(arr.length && docs[0]) showToast(`已导入 ${arr.length} 个文件`); }
    $('searchInput').addEventListener('input',e=>{query=e.target.value.trim(); render();}); $('clearSearch').addEventListener('click',()=>{query=''; $('searchInput').value=''; render(); $('searchInput').focus();}); $('scopeSelect').addEventListener('change',render); $('sortSelect').addEventListener('change',render); $('uploadBtn').addEventListener('click',()=>$('fileInput').click()); $('dropzone').addEventListener('click',()=>$('fileInput').click()); $('fileInput').addEventListener('change',e=>{importFiles(e.target.files); e.target.value='';}); ['dragenter','dragover'].forEach(evt=>$('dropzone').addEventListener(evt,e=>{e.preventDefault(); $('dropzone').classList.add('dragging');})); ['dragleave','drop'].forEach(evt=>$('dropzone').addEventListener(evt,e=>{e.preventDefault(); $('dropzone').classList.remove('dragging');})); $('dropzone').addEventListener('drop',e=>importFiles(e.dataTransfer.files)); document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); activeView=btn.dataset.view; query=''; $('searchInput').value=''; render(); renderDetail();})); $('helpBtn').addEventListener('click',()=>showToast('支持多个关键词和引号短语搜索，点击结果可查看全文')); $('settingsBtn').addEventListener('click',()=>showToast('索引设置已是本地模式')); $('newFolderBtn').addEventListener('click',()=>showToast('文件夹功能将在后续版本开放'));
    render(); renderDetail(); if(window.lucide) lucide.createIcons();
  </script>
</body>
</html>
